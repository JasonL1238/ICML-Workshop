run:
  mode: "pilot"   # options: pilot, batch, full
  resume: true
  overwrite: false
  random_seed: 42

  # When true: use only data.selected_tasks below (order preserved).
  use_selected_tasks_only: true

  # Informational only while use_selected_tasks_only is true (for logs / metadata).
  task_group: "main_clean_binary"

data:
  dataset_name: "nguha/legalbench"

  # Preferred evaluation split.  LegalBench provides train + test;
  # we use the test split for all evaluation to stay faithful to the
  # benchmark methodology.
  eval_split: "test"

  # Eight binary-answer LegalBench tasks spanning 6 legal domains.
  # All answers are strictly Yes/No.
  selected_tasks:
    - "telemarketing_sales_rule"
    - "personal_jurisdiction"
    - "hearsay"
    - "diversity_2"
    - "diversity_6"
    - "proa"
    - "international_citizenship_questions"
    - "nys_judicial_ethics"

  # Pilot: 2 tasks, 5 rows each (quick sanity check).
  pilot:
    max_tasks: 2
    max_rows_per_task: 5
    max_total_rows: 10
    sampling_strategy: "per_task_cap"

  # Batch: all 8 tasks, 50 rows each.
  batch:
    max_tasks: 8
    max_rows_per_task: 50
    max_total_rows: 400
    sampling_strategy: "per_task_cap"

  # Full: all 8 tasks, up to 300 rows per task, no global cap.
  # Each base situation produces 3 conditions → up to 7200 eval prompts.
  # Actual total is lower because some tasks have <300 usable rows.
  full:
    max_tasks: 8
    max_rows_per_task: 300
    max_total_rows: null
    sampling_strategy: "per_task_cap"

generation:
  provider: "anthropic"
  model: "claude-sonnet-4-6"
  naive_calm_temperature: 0.2
  naive_distressed_temperature: 0.35
  fact_check_temperature: 0.0
  max_tokens_naive_calm: 700
  max_tokens_naive_distressed: 900
  max_tokens_fact_check: 1000

evaluation:
  provider: "openai"
  model: "gpt-5.4"
  temperature: 0.0
  max_tokens: 700
  # Short completions for LegalBench-style exact prompts (script 08).
  # With stop_sequences=["\n"], output is typically 1-2 tokens.
  legalbench_exact_max_tokens: 10

evaluation_claude:
  provider: "anthropic"
  model: "claude-haiku-4-5"
  temperature: 0.0
  legalbench_exact_max_tokens: 10

evaluation_sonnet:
  provider: "anthropic"
  model: "claude-sonnet-4-6"
  temperature: 0.0
  legalbench_exact_max_tokens: 10

evaluation_deepseek:
  provider: "deepseek"
  model: "deepseek-v4-pro"
  temperature: 0.0
  legalbench_exact_max_tokens: 10
  base_url: "https://api.deepseek.com"

files:
  expert_candidates: "data/processed/expert_candidates.jsonl"
  with_naive_calm: "data/triplets/with_naive_calm.jsonl"
  with_naive_distressed: "data/triplets/with_naive_distressed.jsonl"
  fact_checked_triplets: "data/triplets/fact_checked_triplets.jsonl"
  final_triplets_all: "data/triplets/final_triplets_all.jsonl"
  final_triplets_passed_only: "data/triplets/final_triplets_passed_only.jsonl"
  model_eval_prompts: "data/eval/model_eval_prompts.jsonl"
  eval_outputs: "data/eval/anthropic_eval_outputs.jsonl"
  legalbench_exact_eval_prompts: "data/eval/legalbench_exact_eval_prompts.jsonl"
  legalbench_exact_eval_outputs: "data/eval/legalbench_exact_eval_outputs.jsonl"
  legalbench_exact_scored_outputs: "data/eval/legalbench_exact_scored_outputs.csv"
  legalbench_exact_eval_outputs_claude: "data/eval/legalbench_exact_eval_outputs_claude.jsonl"
  legalbench_exact_scored_outputs_claude: "data/eval/legalbench_exact_scored_outputs_claude.csv"
  legalbench_exact_eval_outputs_deepseek: "data/eval/legalbench_exact_eval_outputs_deepseek.jsonl"
  legalbench_exact_scored_outputs_deepseek: "data/eval/legalbench_exact_scored_outputs_deepseek.csv"
  legalbench_exact_eval_outputs_deepseek_tight: "data/eval/legalbench_exact_eval_outputs_deepseek_tight.jsonl"
  legalbench_exact_scored_outputs_deepseek_tight: "data/eval/legalbench_exact_scored_outputs_deepseek_tight.csv"
  legalbench_exact_eval_outputs_sonnet: "data/eval/legalbench_exact_eval_outputs_sonnet.jsonl"
  legalbench_exact_scored_outputs_sonnet: "data/eval/legalbench_exact_scored_outputs_sonnet.csv"
